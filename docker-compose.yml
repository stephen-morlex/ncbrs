services:
  # The central tier's database (draft 6.4, 7.1). SQLite remains the dev
  # stand-in and the test provider, but every control the registry depends on
  # -- append-only audit triggers, the filtered unique indexes, the
  # [ConcurrencyCheck] retry on BRN blocks -- has to be exercised against the
  # engine that will actually hold them.
  #
  # Pinned, and on a named volume: a registry that loses its database when a
  # container is recreated teaches the wrong habits even in development.
  postgres:
    image: postgres:17.2
    ports:
      # 5433 on the host, not 5432. A developer machine may already run a
      # local PostgreSQL, and when it does, both bind the port and connections
      # reach whichever answers first -- which presents as
      # "password authentication failed", sending you to hunt a credential
      # problem that does not exist.
      - "5433:5432"
    environment:
      POSTGRES_DB: ncbrs
      POSTGRES_USER: ncbrs
      # Development only. The central tier takes its credentials from a
      # secret store, never from a compose file -- the same rule the
      # certificate signing key follows.
      POSTGRES_PASSWORD: ncbrs-dev
    # Continuous archiving (WS-A6). Without it the only recovery point is the
    # last dump, so a nightly schedule means losing up to a day of births --
    # and a birth that was registered and then lost is worse than one never
    # registered, because the family was told it was done and holds a
    # certificate the register cannot account for.
    #
    # archive_timeout forces a segment even when write volume is low, which is
    # the normal state for a registry overnight: without it a quiet period
    # leaves the last hours of the day unarchived in a partly-filled segment.
    #
    # The chown is not incidental. A named volume is created root-owned, and
    # postgres runs as uid 999, so archiving fails with "permission denied" --
    # silently, as far as the application is concerned. The database keeps
    # accepting registrations, nothing user-visible breaks, and the absence of
    # any recovery point is discovered on the day it is needed. Monitoring
    # must alert on pg_stat_archiver.failed_count for exactly this reason.
    command:
      - bash
      - -c
      - |
        mkdir -p /var/lib/postgresql/archive
        chown postgres:postgres /var/lib/postgresql/archive
        exec docker-entrypoint.sh postgres \
          -c wal_level=replica \
          -c archive_mode=on \
          -c "archive_command=test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f" \
          -c archive_timeout=60
    volumes:
      - ncbrs-postgres:/var/lib/postgresql/data
      # A separate volume on purpose. An archive on the same disk as the data
      # it protects is not a backup -- it is a second copy of the thing that
      # fails. In production this ships off the host entirely, which is also
      # what puts the audit trail beyond a database owner's reach (WS-A2).
      - ncbrs-postgres-archive:/var/lib/postgresql/archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncbrs -d ncbrs"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Official Apache image, pinned. The previous bitnami/kafka:latest no
  # longer resolves -- Bitnami moved their catalogue, so the old reference
  # fails to pull and the whole local stack with it.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # 30 days, the low end of the 30-90 day replay window the draft asks
      # for (Section 6.4.1) -- consumers can be rebuilt from the topic
      # rather than from a database backfill.
      KAFKA_LOG_RETENTION_HOURS: 720

  # Identity provider for users (registrars, district officers, ministry
  # admins) and clients (the device app, the scanner, the dashboard).
  #
  # Self-hosted rather than a SaaS IdP on purpose: the draft's data-residency
  # requirement (Section 7.1) applies to citizens' identities too, not just
  # birth records.
  #
  # start-dev is explicitly NOT a production mode -- it runs on an in-memory
  # H2 database and serves plain HTTP. A real deployment needs `start` with a
  # persistent database and TLS terminated in front of it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      # Imported on startup so every developer gets the same realm, roles and
      # client without clicking through the admin console.
      - ./keycloak/ncbrs-realm.json:/opt/keycloak/data/import/ncbrs-realm.json:ro

volumes:
  ncbrs-postgres:
  ncbrs-postgres-archive:
