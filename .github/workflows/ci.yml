name: CI

# Every pull request into main, and main itself. A check that only runs
# after merge tells you what you already shipped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the run it interrupted. Without this, a branch pushed
# three times queues three full runs and the useful one waits behind two
# obsolete ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The fast one. SQLite in memory, a few seconds, and it is what a
  # contributor waits for.
  build-and-test:
    name: Build and test (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  # The slow one, and the one that matters for anything touching the schema.
  #
  # SQLite is permissive where PostgreSQL is strict -- DateTime kinds, string
  # comparison, identifier case, timestamp precision. A suite that only ever
  # runs on SQLite is a suite that has never met the engine the central tier
  # runs on (draft 6.4, 7.1).
  test-postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: ncbrs
          POSTGRES_PASSWORD: ncbrs-ci
        ports:
          - 5432:5432
        # Without this the job races the container and fails on connection
        # refused, intermittently, which reads as a flaky test suite.
        options: >-
          --health-cmd "pg_isready -U ncbrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NCBRS_TEST_PROVIDER: Postgres
      # The harness creates and drops a database per test from a migrated
      # template, so it connects to the maintenance database first.
      NCBRS_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=ncbrs;Password=ncbrs-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test against PostgreSQL
        run: dotnet test --no-build --configuration Release --verbosity normal

  # The central management site. Separate from the .NET jobs because it fails
  # for entirely different reasons and a contributor touching only the API
  # should not wait on npm, nor read a red tick that has nothing to do with
  # their change.
  #
  # Lint, typecheck and build, in that order: the cheapest check that can
  # fail runs first. `--deny-warnings` because a warning nobody is made to
  # fix is a warning that accumulates until the output is scrolled past.
  web:
    name: Build (web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` rather than `install`: it installs the lockfile exactly and
      # fails if package.json and the lockfile disagree. `install` would
      # quietly resolve a different tree in CI than the one that was
      # reviewed.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Typecheck
        run: npm run typecheck

      # Ahead of the build: a failing assertion is a more useful message than
      # a bundle that builds and is wrong.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The contract check. Option C from the plan: the documents are committed,
  # and the build regenerates them from the real endpoints, so the committed
  # copy cannot silently stop describing the code.
  #
  # This is what a stale contract looks like without it: someone changes a
  # response shape, does not regenerate, and the web app keeps compiling
  # against types that describe the old shape. Nothing fails until a field is
  # undefined in a registrar's browser. Here it fails in the PR that caused
  # it.
  contract:
    name: Contract (OpenAPI + client)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Building the two services writes web/openapi/*.json, because both
      # reference Microsoft.Extensions.ApiDescription.Server and point
      # OpenApiDocumentsDirectory there.
      # One project per invocation: `dotnet build a b` is MSB1008, not two
      # builds.
      - name: Build the API (regenerates its OpenAPI document)
        run: dotnet build src/NCBRS.Api --configuration Release

      - name: Build the consumer (regenerates its OpenAPI document)
        run: dotnet build src/NCBRS.Consumer --configuration Release

      - name: Install
        working-directory: web
        run: npm ci

      - name: Regenerate the typed client
        working-directory: web
        run: npm run generate

      # --exit-code fails on any difference. `git status` first so a failure
      # names the files rather than only the diff.
      - name: Fail if the committed contract is stale
        run: |
          git status --porcelain web/openapi web/src/api/generated
          git diff --exit-code -- web/openapi web/src/api/generated

  # The critical paths end to end -- register, amend and approve, issue,
  # annul -- through the real UI, the real API and the real identity
  # provider. The unit suites prove each piece; this proves they meet.
  #
  # Its own job because it needs a running stack and takes minutes, and the
  # fast signals above should not wait behind it.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Compose refuses to start without the variables .env supplies, even
      # for a service that does not read them. The example's values are
      # development-only.
      - name: Start Keycloak
        run: |
          cp .env.example .env
          docker compose up -d keycloak

      - name: Install
        working-directory: web
        run: |
          npm ci
          cp .env.example .env.local
          npx playwright install --with-deps chromium

      # Keycloak imports the realm on start. The suite fails fast if the
      # realm is missing, so wait for it rather than race it.
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/ncbrs > /dev/null && exit 0
            sleep 3
          done
          docker compose logs keycloak | tail -50
          exit 1

      # Playwright starts the API (Development: migrates and seeds SQLite)
      # and the web dev server itself.
      - name: Run the critical paths
        working-directory: web
        run: npx playwright test

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
